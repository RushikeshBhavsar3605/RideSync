syntax = "proto3";

package trip;

option go_package = "shared/proto/trip;trip";

// TripService provides trip planning and preview operations.
service TripService{
    // PreviewTrip returns route and pricing estimates for a potential trip.
    rpc PreviewTrip(PreviewTripRequest) returns (PreviewTripResponse);
}

message PreviewTripRequest {
    string user_id = 1;
    Coordinate start_location = 2;
    Coordinate end_location = 3;
}

message PreviewTripResponse{
    string trip_id = 1;
    Route route = 2;
    repeated RideShare ride_fares = 3;
}

message Coordinate{
    double latitude = 1;
    double longitude = 2;
}

message Route{
    repeated Geometry geometry = 1;
    double distance = 2;
    double duration = 3;
}

message Geometry{
    repeated Coordinate coordinates = 1;
}

message RideShare {
    string id = 1;
    string user_id = 2;
    string package_slug = 3;
    double total_price_cents = 4;
}