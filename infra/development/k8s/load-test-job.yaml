apiVersion: batch/v1
kind: Job
metadata:
  name: load-test-trip-creation
spec:
  template:
    spec:
      containers:
      - name: load-test
        image: load-test:latest
        args:
        - "-rate=1000"
        - "-duration=10m"
        - "-scenario=trip-creation"
        - "-rabbitmq-uri=amqp://guest:guest@rabbitmq:5672/"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
      restartPolicy: Never
  backoffLimit: 0
